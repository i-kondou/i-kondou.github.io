- id: sigss-constraints-2026
  date: "2026.07"
  home:
    title: バグ混入コミットによる過去制約違反の実証研究を発表しました。
    title_en: I presented an empirical study of past constraint violations by bug-inducing commits.
    tag: 発表
    url: https://sel.ist.osaka-u.ac.jp/lab-db/betuzuri/contents.ja/1339.html
  tag: 研究会発表
  tag_en: Talk
  title: SIGSS / SIGSEの合同研究会にて研究発表
  title_en: Research presentation at the joint SIGSS / SIGSE meeting
  description: >-
    北海道札幌市で開催されたソフトウェアサイエンス研究会（SIGSS）・ソフトウェア工学研究会（SIGSE）などの合同研究会にて、
    「バグ混入コミットによる過去制約違反の実証研究」を発表しました。
    バグが混入する変更と、それ以前のプログラムが満たしていた制約との関係を調べた研究です。
  description_en: >-
    I presented “An Empirical Study of Past Constraint Violations by Bug-Inducing Commits” at the joint meeting of SIGSS, SIGSE, and related technical committees in Sapporo, Hokkaido.
    The study examines the relationship between bug-inducing changes and constraints satisfied by earlier versions of a program.
