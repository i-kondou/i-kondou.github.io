    title_en: I presented an English poster on identifying bug-inducing commits with Claude Code at SES 2026.
    tag: 発表
  tag: ポスター発表
  tag_en: Poster
  title: SES 2026にて英語ポスター発表
  title_en: English poster presentation at SES 2026
  description: >-
    神奈川県横浜市の慶應義塾大学日吉キャンパスで開催されたソフトウェアエンジニアリングシンポジウム2026（SES 2026）の学生国際英語ポスターセッションにて、
    「Can Claude Code Find Bug-Inducing Commits? An Empirical Study of Identification, Investigation, and Justification」を発表しました。
    Claude Codeによるバグ混入コミットの特定と、調査過程・根拠の説明を扱った研究です。
  description_en: >-
    I presented “Can Claude Code Find Bug-Inducing Commits? An Empirical Study of Identification, Investigation, and Justification”
